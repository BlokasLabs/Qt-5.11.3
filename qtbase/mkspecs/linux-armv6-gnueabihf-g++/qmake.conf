# Raspberry Pi Zero / Pi 1: ARM1176, VFPv2, hard-float ABI, no NEON.
MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

# A build environment can supply a compiler prefix with a target sysroot and
# runtime selection. Keep installation paths out of the platform specification.
MH_CROSS_COMPILE = $$(CROSS_COMPILE)
isEmpty(MH_CROSS_COMPILE): MH_CROSS_COMPILE = arm-linux-gnueabihf-
QMAKE_CC         = $${MH_CROSS_COMPILE}gcc
QMAKE_CXX        = $${MH_CROSS_COMPILE}g++
QMAKE_LINK       = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_AR         = $${MH_CROSS_COMPILE}ar cqs
QMAKE_OBJCOPY    = $${MH_CROSS_COMPILE}objcopy
QMAKE_NM         = $${MH_CROSS_COMPILE}nm -P
QMAKE_STRIP      = $${MH_CROSS_COMPILE}strip

QMAKE_CFLAGS   += -march=armv6zk -mtune=arm1176jzf-s -marm -mfpu=vfp -mfloat-abi=hard
QMAKE_CXXFLAGS += -march=armv6zk -mtune=arm1176jzf-s -marm -mfpu=vfp -mfloat-abi=hard
load(qt_config)
